name: Deploy latest OCF Smart Play media
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocf-media-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py manifest.json media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: media
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
