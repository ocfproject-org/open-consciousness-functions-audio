name: Validate site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned OCF source commit
        id: source
        shell: bash
        run: echo "commit=$(python -c 'import json; print(json.load(open("site/source.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ocfproject-org/open-consciousness-functions
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          path: ocf-source
      - name: Install pinned OCF documentation dependencies
        run: python -m pip install -e ./ocf-source
      - name: Validate site and catalog
        run: python scripts/validate_site.py
      - name: Run offline publication and catalog tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/test_smart_playback.mjs
      - name: Check browser script syntax
        run: node --check site/assets/js/app.js
      - name: Test catalog search and selection logic
        run: node scripts/test_catalog.js
      - name: Test shared edition preference validation
        run: node scripts/test_editions.js
      - name: Test surprise selection and local history
        run: node scripts/test_surprise.js
      - name: Test private learned tracking and backup validation
        run: |
          node scripts/test_learned.js
          node scripts/test_affirmations.js
          node scripts/test_morning.js
          node scripts/test_preferences_backup.js
      - name: Test documentation search and transcript URL safety
        run: node scripts/test_docs.js
      - name: Build the complete pinned website and verify published sidecars
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ocf-source/scripts
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python scripts/refresh_catalog.py --output verified-catalog.json
          python scripts/smart_playback_media.py --output experiment-media
          python -m ocf_tools.public_site_export --source-commit "${{ steps.source.outputs.commit }}" --output public-guide-export.json
          smart=()
          if [[ -f smart-play/public-release.json ]]; then smart+=(--public-smart-play); fi
          python scripts/build_public_site.py --site-root site --content-dir docs/website --source-pin site/source.json --guide-export public-guide-export.json --catalog verified-catalog.json --historical-reference ocf-source/docs/releases/OCF_HISTORICAL_LOOKUP_CURRENT.md --smart-playback-media experiment-media/comfort-401a132683e40b34.mp3 --continuous-smart-play --output verified-site "${smart[@]}"
          python scripts/validate_site.py verified-site
      - name: Add and validate the isolated preview in same-repository CI
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          python scripts/stage_shared_clip_canary.py --site verified-site
          python scripts/validate_site.py verified-site
      - name: Stage and validate the pinned public Smart Play bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python scripts/load_public_smart_play.py --site verified-site
          python scripts/validate_site.py verified-site
      - name: Install pinned browser test dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npm ci
      - name: Install Chromium for browser/accessibility gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npx playwright install --with-deps chromium
      - name: Verify Playwright rejects a preoccupied server port
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npm run test:browser:guard
      - name: Test the generated site in Chromium and axe-core
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          AUDIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser
      - name: Verify isolated streaming experiment
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          node scripts/test_smart_playback_browser.cjs
          node scripts/test_continuous_smart_play.cjs
      - name: Exercise the exact shared-clip preview with the established site
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python scripts/check_shared_clip_canary.py verified-site
      - name: Verify native playback from the published Smart Play media
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: bash scripts/check_public_smart_play.sh verified-site
      - name: Retain public-safe browser acceptance evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 30
